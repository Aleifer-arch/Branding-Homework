<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { margin:0; background:#0A1E2E; font-family:sans-serif; overflow:hidden; }
  .slider { width:100vw; height:100vh; position:relative; }
  .slide { position:absolute; width:100%; height:100%; opacity:0; 
           display:flex; align-items:center; justify-content:space-around; 
           animation: slideShow 12s infinite; }
  .slide img { width:45%; border-radius:20px; box-shadow:0 0 30px rgba(0,0,0,0.5); }
  .text { width:45%; color:#F4EFEA; }
  .text h2 { font-size:3rem; color:#2ECC71; margin:0; }
  .text p { font-size:1.5rem; line-height:1.6; }
  
  .slide:nth-child(1) { animation-delay:0s; }
  .slide:nth-child(2) { animation-delay:4s; }
  .slide:nth-child(3) { animation-delay:8s; }
  
  @keyframes slideShow {
    0% { opacity:0; transform:translateX(100%); }
    8% { opacity:1; transform:translateX(0); }
    33% { opacity:1; transform:translateX(0); }
    41% { opacity:0; transform:translateX(-100%); }
    100% { opacity:0; transform:translateX(-100%); }
  }
  
  @media (max-width: 768px) {
    .slide { flex-direction:column; text-align:center; }
    .slide img { width:80%; margin-bottom:20px; }
    .text { width:80%; }
    .text h2 { font-size:2rem; }
    .text p { font-size:1rem; }
  }
</style>
</head>
<body>
<div class="slider">
  <div class="slide">
    <img src="foto1.jpg">
    <div class="text">
      <h2>Tampilan Menggoda</h2>
      <p>Wonton Chili Oil dengan taburan kacang & daun ketumbar. Visual premium, rasa bintang lima.</p>
    </div>
  <div class="slide">
    <img src="foto2.jpg">
    <div class="text">
      <h2>Kaya Protein</h2>
      <p>Dibuat dari daging ayam segar. Tinggi protein, 0% pengawet, aman untuk lambung.</p>
    </div>
  </div>
  <div class="slide">
    <img src="foto3.jpg">
    <div class="text">
      <h2>Praktis Penyajian</h2>
      <p>Dikukus 5 menit langsung jadi. Solusi makanan lembut untuk pelajar.</p>
    </div>
  </div>
</div>
</body>
</html>
